server.port=8080
spring.application.name=springboot_security

# -------------------------------------------------------
# Spring Security 기본 자동설정 시 사용되는 인메모리 계정
# SecurityConfig.java 에서 UserDetailsService Bean을 등록하면 아래 설정은 무시된다
# -------------------------------------------------------
spring.security.user.name=user
spring.security.user.password=1234
spring.security.user.roles=USER

# 로그 레벨 - Security 필터 체인 동작 확인용
logging.level.org.springframework.security=DEBUG
